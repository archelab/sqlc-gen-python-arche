version: "2"
plugins:
  - name: python
    wasm:
      url: file://../sqlc-gen-python-arche.wasm
      sha256: d353702d497591b1b4735e94fe103baf1ad87cfa84da4ce924f9f4c93684e338
sql:
  # MAJOR-1 escape proof: the body rewrite escapes EVERY colon (cast AND a
  # non-cast literal colon in 'a:b'), then rewrites $N -> :pN. The golden pins
  # `count(*)\\:\\:bigint`, `'a\\:b'`, `= :p1\\:\\:bigint`, and the header
  # `\\:one`. v0.5.6 backslash proof: every backslash of the SQL is doubled in
  # the constant (`E'a\\nb'`, `'\\1\\1'`, `ESCAPE '\\'`), and the live test
  # compares each query with its queries.sql text run directly. schema.sql adds
  # the schema text: enum labels with a backslash and quotes, docstrings that
  # end in a quote, and a two-line column comment.
  - schema: schema.sql
    queries: queries.sql
    engine: postgresql
    codegen:
      - out: gen
        plugin: python
        options:
          package: test.driver_sqlalchemy.sql_escape.gen
          sql_driver: sqlalchemy
          model_type: pydantic
          emit_classes: true
          emit_init_file: false
